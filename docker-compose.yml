services:
  db:
    image: postgres:16
    container_name: scms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scms
      POSTGRES_PASSWORD: scms
      POSTGRES_DB: scms
    ports:
      - "5433:5432"
    volumes:
      - scms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scms -d scms"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: scms-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  scms-pgdata:
